services:
  postgres:
    image: postgres:16-alpine
    container_name: bankhub-postgres
    environment:
      POSTGRES_USER: bankhub
      POSTGRES_PASSWORD: bankhub_dev
      POSTGRES_DB: bankhub
    ports:
      - "5432:5432"
    volumes:
      - bankhub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankhub -d bankhub"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bankhub_pgdata:
